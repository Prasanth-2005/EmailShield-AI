<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      p {
        margin: 0 0 10px;
        color: #94a3b8;
        font-size: 11.5px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.1);
        font-size: 12px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #64748b;
      }
      .dot.up {
        background: #4ade80;
      }
      .dot.down {
        background: #f87171;
      }
      a {
        display: block;
        margin-top: 10px;
        text-align: center;
        padding: 8px;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>EmailShield AI — Gmail Quick Scan</h1>
    <p>
      Open an email in Gmail and click the floating "Analyze with EmailShield"
      button. Body &amp; sender only — full header forensics live in the web app.
    </p>
    <div class="status"><span class="dot" id="dot"></span><span id="msg">Checking backend…</span></div>
    <a href="http://localhost:3000" target="_blank" rel="noopener">Open EmailShield web app</a>
    <script src="popup.js"></script>
  </body>
</html>
